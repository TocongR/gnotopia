name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
    tests:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_DB: gnotopia_test
            POSTGRES_USER: gnotopia
            POSTGRES_PASSWORD: secret
          ports:
            - 5432:5432
          options: >-
            --health-cmd="pg_isready -U gnotopia" --health-interval=10s --health-timeout=5s --health-retries=5

      steps:
        - uses: actions/checkout@v4

        - uses: shivammathur/setup-php@v2
          with:
            php-version: '8.4' # set this to the version printed by `php -v`
            extensions: mbstring, pdo_pgsql, pgsql
            coverage: none

        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - run: composer install --no-interaction --prefer-dist
        - run: cp .env.example .env
        - run: php artisan key:generate
        - run: npm ci
        - run: npm run build
        - run: vendor/bin/pint --test
        - run: php artisan test
          env:
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_USERNAME: gnotopia
            DB_PASSWORD: secret